name: SES Core CI

on:
  push:
    branches: [ "master", "main", "desarrollo" ]
  pull_request:
    branches: [ "master", "main", "desarrollo" ]

jobs:
  test-and-build:
    name: Lint, Test & Compile
    runs-on: ubuntu-latest

    services:
      # Optional: In case real integration tests are added later,
      # but currently tests are 100% mocked, so service containers are not strictly needed.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev,server]"



    - name: Code Style Check (Linter)
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 ses/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 ses/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Test Suite (Pytest)
      env:
        DEBUG: "true"
        VALID_API_KEYS: '{"personal_default": {"tier": "internal", "active": true}, "ses_internal_master_001": {"tier": "internal", "active": true}}'
      run: |
        pytest --cov=ses --cov-report=xml

    - name: Verify Performance Benchmark
      run: |
        python tests/performance/benchmark.py

  security-scan:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install bandit pip-audit
        python -m pip install -e ".[server]"

    - name: Run Bandit (Python security linter)
      run: |
        bandit -r ses/ -ll --format txt
        bandit -r ses/ -ll --format json -o bandit-report.json

    - name: Run pip-audit (dependency vulnerability check)
      run: |
        pip-audit --progress-spinner off --format json --output pip-audit-report.json

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          pip-audit-report.json
        retention-days: 14
